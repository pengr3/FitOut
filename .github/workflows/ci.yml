#         refusing any before it reads a file or the environment, because its prefix source is
#         resolved from the script's own location and cannot be redirected by input — enforced on
#         this file's side by Invariant A's exact-invocation conjunct (entry 5 above) and on the
#         script's side by cases 7 and 8 of `tests/design/mail-credential-refusal.test.ts`, which
#         `npm run build` runs (19-13, review finding CR-01);
#         ⚠ FALSIFIED 2026-09-04 BY PLAN 19-12 (review finding CR-01). THE CLAIM WAS: this step
#         reads the key through a deliberately differently-named step `env:` key, so the parse half
#         does not fire on a CORRECT file. It did, and that carve-out was real — but the GitHub
#         Actions `env` EXPRESSION context is built exclusively from `env:` maps written in this
#         file, and never contains the process environment, secrets, `vars.*`, `container.env` or
#         `services.*.env`. So the step could fire on exactly the one input the parse half already
#         rejects the whole file for, and its coverage over that half was ZERO. It was a
#         fail-closed control documented as active while being structurally incapable of firing.
#         WHAT REPLACED IT is the paragraph above: no `env:` map, no context expression, a script
#         that reads the environment the job actually has.
#       - the PARSE half: the script rejects any workflow, job or step `env:` KEY whose name
#         begins with the mail provider's prefix. It runs on job 1, which is PARALLEL to and
#         independent of job 5, so it protects the NEXT run, never the current one.
#     ⚠ WHICH HALF COVERS WHAT, STATED RATHER THAN LEFT TO BE ASSUMED (review findings WR-02 and
#     WR-03, 2026-09-04). The parse half walks workflow `env:`, job `env:` and step `env:` — but
#     NOT `container.env` and NOT `services.*.env`. That gap is not uncovered, and here is the
#     sentence that says so: the RUNTIME half is the one that observes container.env. A
#     container-level `env:` block reaches every step's process environment, and the process
#     environment is exactly what the step now reads.
#     `services.*.env` sets variables only inside the postgres service container, which runs no
#     application code and is therefore not a mail-send vector. WHAT GENUINELY REMAINS OPEN: the
#     PARSE half still walks neither key — review finding WR-03, carried forward and NOT closed by
#     plan 19-12 — so workflow-file hygiene over `env:` KEYS, which is a different question from
#     what the job's process holds, is still blind at those two levels. A list that omits a known
#     hole is the same defect as a header that omits a job; so is one that implies a hole is
#     covered without saying by which half.
#
# `11-06` RE-MEASURED THE VACUITY FINDING RATHER THAN INHERITING IT, and it is WORSE for job 3
# than it was for jobs 1-2. Its plan prescribed the same shape of whole-file substring check,
# over five job-3 tokens. Run against SIX real mutations of this file on 2026-08-13, alongside
# a 28-assertion parse of the same bytes:
#
#   mutation applied to this file                            substring   parsed
#   -------------------------------------------------------  ---------   ------
#   (control) unmutated                                        GREEN      GREEN
#   job 3's DATABASE_URL host `postgres` -> `localhost`        GREEN*     RED
#   `ports: ["5432:5432"]` ADDED to job 3's service            GREEN      RED
#   job 3's whole `npx playwright test …` STEP deleted         GREEN      RED
#   job 3's service image -> the major-only 404 tag            GREEN      RED
#   job 3's one spec -> `npm run test:e2e` (all twelve)        GREEN      RED
#   `--ipc=host` dropped from the container options            GREEN      RED
#
# SIX OF SIX, on the file as first drafted. Not two of five, as in 11-04. Every token survives
# in this file's own prose: the spec path and the job name are quoted in the comments above,
# `--ipc=host` is quoted in the comment that explains why it is mandatory, and the image tag is
# not one of the five tokens at all.
#
# * THE ASTERISK IS THE FINDING, AND IT IS THE SHARPEST ONE HERE. The host swap was GREEN
# because the FIRST DRAFT of this very table spelled the host token contiguously — the note
# documenting the vacuity was itself an instance of it, measured with a control (strip the
# table, that mutation goes RED; restore it, GREEN). The table above is now written so it does
# NOT spell that token, which is why re-running the matrix against the file you are reading
# reports RED for that one row and GREEN for the other five. Do not "fix" the asterisk by
# writing the token out. Same rule as `src/components/booking/price-breakdown.tsx`'s header.
#
# That is the general law, not a quirk: the substring check gets MORE vacuous the better this
# file is documented, so it decays exactly as the file improves. Parse it. The command is
# directly above, and the 28-assertion script is reproduced in `11-06-SUMMARY.md`.
#
# ============================================================================================
# GATE-01 — THE OBSERVED REDS (D-30). 17 August 2026, plan 11-22.
#
# A VISUAL-REGRESSION GATE THAT HAS NEVER BEEN WATCHED FAILING IS INDISTINGUISHABLE FROM ONE
# THAT IS SILENTLY DISABLED — which is exactly what plan 11-03 found `updateSnapshots` doing
# before it was fixed. So the green run is not the deliverable. These two are.
#
# Both were triggered deliberately, once, by hand, on `dev`, and reverted. Neither threshold was
# tuned, no test was skipped, and no baseline was deleted to make anything go green. There is a
# THIRD red below them that nobody triggered on purpose, and it is arguably the most valuable of
# the three.
#
# CONTEXT FOR BOTH: baselines were generated by `.github/workflows/baselines.yml` in run
# 32018817812 (25 `*-visual-linux.png`, committed as `e37318e`), and FIRST COMPARED — a
# `GITHUB_TOKEN` push triggers no run, so nothing had compared against them until this — in run
# 32021215330 at `10587be`: `Running 34 tests using 1 worker` -> **32 passed, 2 skipped** (1.0m),
# alongside `39 files / 697 passed / 3 skipped` from the design gate. That is the T-11-UNVERIFIED
# step, and it is the reason D-27 did not produce baselines nobody had ever seen pass.
#
# Pre-mutation state for both records: HEAD `10587be`, `git status --short` showing only
# `.planning/config.json` (the orchestrator's), no source file dirty.
#
# ── OBSERVED RED 1 — A MISSING BASELINE FAILS, AND STAYS FAILED ──────────────────────────────
#
#   Mutation: `git rm e2e/visual/surfaces.spec.ts-snapshots/terms-1280-court-visual-linux.png`.
#   One file. Commit `28f49b1`. Run 32021666395 -> FAILURE, exit code 1.
#   (`gate-db` and `gate-price-parity` green throughout — this is job 1's step alone.)
#
#   Verbatim, and IDENTICAL across the initial attempt, Retry #1 and Retry #2:
#
#     Error: A snapshot doesn't exist at /__w/FitOut/FitOut/e2e/visual/surfaces.spec.ts-snapshots/
#     terms-1280-court-visual-linux.png.
#
#           187 |       ).toHaveAttribute("data-theme", row.theme);
#           188 |
#         > 189 |       await expect(page).toHaveScreenshot(baselineArg(row), {
#             at /__w/FitOut/FitOut/e2e/visual/surfaces.spec.ts:189:26
#
#       1 failed
#         [visual] › e2e/visual/surfaces.spec.ts:160:9 › terms-1280-court.png
#       2 skipped
#       31 passed (1.1m)
#
#   THE FOUR THINGS THAT MAKE THIS RECORD WORTH KEEPING, and they describe 11-RESEARCH's
#   MEASURED behaviour of Playwright 1.60.0 rather than D-135's assumed one:
#
#     1. The error names the missing path in full.
#     2. NO `, writing actual.` CLAUSE. Absent from all three attempts. Under Playwright's
#        default `"missing"` mode that clause is present, and it is the tell that the run just
#        minted the reference it was supposed to be checking against (Finding 3).
#     3. ZERO PNGs WRITTEN. `git diff --name-only 28f49b1..origin/dev` after the run: empty.
#     4. ⚠ THE LOAD-BEARING ONE. The failure is RETRIABLE, so all three CI attempts were red —
#        and then "Re-run failed jobs" WITH NO CODE CHANGE gave attempt 2, conclusion FAILURE.
#        THE RED DID NOT SELF-HEAL. Under the default mode this exact situation writes the PNG
#        and the bare re-run is GREEN off a baseline the failed run just minted; nobody
#        investigates a gate that passes when you press the button again, and the reference
#        every future run compares against would have been produced by whichever machine
#        happened to go second. D-28 dropping D-135's environment-conditional ternary is what
#        closed that, and this re-run is the only way to show it closed.
#
#   AND WHAT DID NOT FAIL, which is what makes this a gate rather than a scanner that fails on
#   everything: THE OTHER 24 BASELINES COMPARED CLEAN.
#
#   GREEN RUN: `git revert --no-edit 28f49b1` -> `b12fc03`; `git diff 10587be b12fc03 --
#   e2e/visual/` EMPTY (the exact bytes back, no re-dispatch needed). Run 32022459245 ->
#   success, all three jobs.
#
# ── OBSERVED RED 2 — A TWO-PIXEL SHIFT FAILS. AND THE PREDICTION WAS WRONG. ──────────────────
#
#   Mutation: `site-footer.tsx:132`, `border-t` -> `border-t-[3px]`. One token, +2px on the
#   footer's top border. Commit `f4db983`. Run 32022921641 -> FAILURE.
#   NO THRESHOLD WAS TUNED. None is needed: `toHaveScreenshot`'s default `maxDiffPixels` is 0.
#
#     18 failed / 2 skipped of 34  ->  14 passed
#
#   ⚠ THE PLAN'S EXECUTOR PREDICTED 20 FAILED / 12 PASSED, ON THE REASONING "every baseline of
#   every surface that renders SiteFooter". THAT WAS WRONG, and the two that passed are the
#   finding. `root-not-found-1280-court` and `root-not-found-1280-grove` PASSED while rendering
#   the footer. Recorded as wrong rather than quietly corrected, because a prediction that
#   missed and was then measured is worth more than one that happened to land.
#
#   The 18, from the run's own markers:
#     auth-login-{1280,320}-{court,grove}          4
#     privacy-{1280,768,320}-{court,grove}         6
#     terms-{1280,768,320}-{court,grove}           6
#     root-not-found-320-{court,grove}             2
#
#   Two distinct failure shapes appeared in the output, and the split is the mechanism:
#     Expected an image 320px by 920px, received 320px by 922px. 2670 pixels (ratio 0.01 of
#     all image pixels) are different.            <- the document GREW by exactly 2px
#     3454 pixels (ratio 0.01 of all image pixels) are different.   <- same size, pixels moved
#
#   MEASURED AFTERWARDS IN A REAL BROWSER rather than reasoned about (local Chromium, same
#   freeze.css, court unless noted; layout geometry in CSS px is identical to the container's).
#   Applying and reverting the same one-token nudge:
#
#     surface           w     docH before->after   main box            what moves
#     ----------------  ----  ------------------   -----------------   ---------------------------
#     terms / privacy   all   grows +2             content-driven      everything below -> FAILS
#     root-not-found    320   755 -> 757 (+2)      gapAbove 0          document grows   -> FAILS
#     auth-login       1280   800 -> 800 (+0)      flex, CENTERED,     card shifts 1px  -> FAILS
#                                                  551 -> 549 tall
#     root-not-found   1280   800 -> 800 (+0)      block, mt-auto,     NOTHING moves    -> PASSES
#                                                  394 -> 394 (spacer
#                                                  157 -> 155)
#
#   SO THE RULE IS NOT "renders a footer" AND IT IS NOT MERELY "layout mode". THREE conditions
#   have to coincide for a pass, and `root-not-found` at 1280 is the only baseline that meets
#   all three:
#     (a) an `mt-auto` spacer absorbs the 2px, so the image does not change size;
#     (b) the content above is TOP-ANCHORED in a block box, so nothing in it moves — measured,
#         `main` stayed exactly [64..458] and 394px tall. `auth-login` fails (a)-and-(b)
#         together: it absorbs too, but its `main` is `display:flex; align-items:center;
#         justify-content:center`, so shrinking it 551->549 moves the centred card by 1px;
#     (c) the ONLY pixels that change are the 2px strip where page background becomes border —
#         and that pair is BELOW PLAYWRIGHT'S DEFAULT PER-PIXEL THRESHOLD. Measured in sRGB:
#         border rgb(229,229,229) against background rgb(255,255,255) gives a pixelmatch YIQ
#         deltaSquared of 341.6 (grove: 397.2) against a cutoff of 35215 * 0.2^2 = 1408.6.
#         Four times under. That is the SAME `--border` on `--background` pair
#         `src/lib/design/contrast-pairs.ts` carries in EXCLUDED_PAIRS at 1.26:1 (court) /
#         1.28:1 (grove) precisely because it is a nearly invisible decorative divider.
#
#   ⚠ (c) IS A REAL BLIND SPOT AND IT IS RECORDED, NOT PAPERED OVER: a change confined to
#   `--border` on `--background` is INVISIBLE to this gate at default settings. It is left at
#   the default deliberately — dropping `threshold` toward 0 would make font antialiasing a
#   failure on every run, and a gate that cries wolf is retried until green, which is the thing
#   this phase exists to remove. The blind spot is stated in `e2e/visual/surfaces.spec.ts`'s
#   NOT COVERED footer so the next reader under-trusts the gate by exactly the right amount.
#
#   WHAT DID NOT FAIL: `dev-theme` x3 and both OG cards — exactly the surfaces with no footer.
#   The gate discriminates by what is actually on the surface, which is a checkable claim.
#
#   GREEN RUN: `git revert --no-edit f4db983`; `git diff b12fc03 HEAD` EMPTY, footer back to
#   `mt-auto border-t bg-muted`; CI green on the restore.
#
# ── THE THIRD RED, WHICH NOBODY TRIGGERED ON PURPOSE ─────────────────────────────────────────
#
#   Moving job 1 into the container (commit `835de11`) broke git for the one test that shells
#   out to it, and run 32020141784 failed with `detected dubious ownership`. The full record —
#   including the counterfactual in which the obvious `try { } catch { return [] }` spelling
#   would have reported GREEN with D-29 enforced by nothing — is probe (e) in
#   `tests/design/gitignore-baselines.test.ts`'s header, because it is that gate's win. The
#   fix is job 1's `Let git operate on the checkout` step below. Worth reading alongside these
#   two: plan 11-03 built that guard against a hypothesis, and the environment produced the
#   hypothesis nineteen plans later.
#
# ── WHAT THESE GATES DO NOT DO (2026-09-04, plan 19-11) ──────────────────────────────────────
#
# `gate-e2e` REPORTS; IT DOES NOT BLOCK. It is not a required status check on `main`, and that
# is a recorded decision rather than an oversight: branch protection is UNREACHABLE on this
# repository — `gh api repos/:owner/:repo/branches/main/protection` returns
# `403 — Upgrade to GitHub Pro or make this repository public` (probed 2026-09-04, plan 19-08),
# and rulesets return the same. It is a visibility-or-billing decision held by the PM, recorded
# in `19-08-SUMMARY.md` and `.planning/WINDOWS.md`. The second prerequisite stands beside it:
# the suite has never once been green. A required check that is red on arrival is a wall, not a
# gate. Everything above makes this gate harder to DETACH; none of it makes it BLOCKING.
# ============================================================================================

name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

# T-11-CIWRITE. Read-only by default, for every job. `contents: write` is granted per-job, and
# only by plan 11-22's baseline-dispatch job, which is the one thing here that pushes a commit.
permissions:
  contents: read

# The `github.event_name` term is NOT decoration. A group of workflow+ref alone is
# event-agnostic, so a push to `dev` would cancel a `workflow_dispatch` baseline run already
# in flight on the same ref — killing it mid-commit and leaving a partial set of baseline PNGs
# on the branch, which is worse than no baselines at all. Keying on the event as well means a
# push can only ever cancel a previous push.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}"
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------------------------------
  # JOB 1 — the DB-free gate, which PROVES it is DB-free on every single run.
  #
  # `npm run build` is `lint && test:design && next build`, so that one step is three gates at
  # once: the ESLint gate (including the design-leak rule), the ~700-assertion design gate, and
  # GATE-05's `server-only` client/server boundary check, which fails `next build` outright if
  # any client graph reaches a money or availability module.
  #
  # ⚠ A PASSAGE HERE WAS FALSIFIED ON 2026-08-19 (plan 12-15), AND IT IS RECORDED AS FALSIFIED
  # RATHER THAN QUIETLY DELETED, because the next reader is owed the falsification and not a clean
  # file. From 2026-08-17 this job was ALSO the visual-regression gate (GATE-01, plan 11-22), and
  # this comment argued: "The two halves stay in ONE job deliberately: they share the same DB-free
  # assertion, and splitting them would mean a second `npm ci` and a second copy of the
  # unreachable-database argument to keep in sync."
  #
  # THE PREMISE IS NOW FALSE. Phase 12 baselined product surfaces, so the comparison needs a
  # seeded database — the two halves stopped sharing that assertion, and the only stated reason for
  # keeping them together expired with it. The comparison moved to `gate-visual`; the second
  # `npm ci` is the acknowledged price, and it is repaid because the ~30-minute visual step no
  # longer serialises behind the build. The unreachable-database argument was never duplicated:
  # `gate-visual` makes the opposite argument, and both are now parsed rather than remembered.
  #
  # This job STILL RUNS IN THE CONTAINER, and that is deliberate rather than left over — see the
  # third bullet of the header's invariants list, and the git step below.
  #
  # THE JOB KEY `gate-db-free` DOES NOT MOVE. It is the thing this file, `baselines.yml`'s header
  # and the 11-22 OBSERVED RED records all quote, and it stays TRUE under this design. The
  # parenthetical in `name:` is a description of the step list and tracks it — 11-22 appended
  # "+ visual" to it when the step arrived, and 12-15 replaces that with the parse now that the
  # step has left. A description that outlives what it describes is the defect class this
  # repository keeps recording.
  # ------------------------------------------------------------------------------------------
  gate-db-free:
    name: gate-db-free (lint + design + build + workflow parse)
    runs-on: ubuntu-latest

    # IN the pinned Playwright image — the SAME image, at the SAME exact tag, that
    # `.github/workflows/baselines.yml` generates the baselines in. That identity is the whole of
    # D-27: a screenshot is a function of the browser, the fonts and the OS that produced it, so
    # the only way "the baseline matches" can mean anything is for the machine that compares to
    # be the machine that shot. If these two tags ever diverge, every baseline in the repository
    # becomes noise on the same day, and the failure looks like 25 unrelated visual regressions.
    #
    # The tag must ALSO equal the project's exact `@playwright/test` pin (1.60.0, pinned exact by
    # plan 11-03 for this reason, T-11-VERDRIFT): Playwright's own docs say a mismatch leaves it
    # "unable to locate browser executables". THREE things move together or none of them do — the
    # package, this tag, and `baselines.yml`'s tag.
    #
    # No `npx playwright install` step: the image ships the browsers and their OS dependencies.
    # `--ipc=host` is Playwright's documented Chromium recommendation — "without it, Chromium can
    # run out of memory and crash", which presents as a flaky test and therefore gets retried
    # rather than fixed. Same options as job 3, for the same reasons.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --ipc=host

    # No `services:` block. That absence is the point of this job, and the DATABASE_URL below
    # is what stops it from being a claim.
    env:
      # THE ASSERTION. This URL points at a closed port on the loopback interface: nothing
      # listens on 59999 and nothing ever will. Measured at HEAD on 2026-08-13, `npm run build`
      # with this value exits 0, because every DB-touching route classifies as dynamic and
      # postgres.js connects lazily — module evaluation during page-data collection neither
      # throws nor dials out.
      #
      # Setting it converts "job 1 is DB-free" from a one-time measurement into a standing
      # per-run assertion: the day a phase adds a build-time database read — most plausibly a
      # root `not-found.tsx` or `global-error.tsx` that reaches `@/lib/db` on a path Next CAN
      # prerender — this job goes red immediately and the trace names the file.
      #
      # IT IS AT JOB LEVEL RATHER THAN ON THE BUILD STEP SINCE 2026-08-17, AND IT STAYS THERE —
      # BUT THE REASON CHANGED ON 2026-08-19 (plan 12-15), so here is the old one and its
      # replacement rather than a silently-corrected sentence. The old reason: "the visual step
      # needs it too and the app the dev server boots must not be able to reach a different
      # database from the one the build was checked against. One variable, two steps, no drift."
      # The visual step is no longer in this job, so that reason expired.
      #
      # THE NEW REASON, and it is why moving the variable back onto the build step would be a
      # gratuitous mutation: at job level, ANY step added to this job inherits the assertion. On
      # the build step, the next step somebody adds here inherits nothing, and the job goes back to
      # being DB-free only where it was remembered to be. The parser now asserts the pairing
      # structurally — this job declares no `services:` AND its `DATABASE_URL` is the unreachable
      # sentinel — so the two halves of T-11-DBFREE can no longer drift apart quietly.
      #
      # WHERE THE SCOPING RULE WENT. 11-UI-SPEC § GATE-01's "Phase 11 baselines ONLY DB-free
      # surfaces" is what used to make the visual step safe here, and this line is what made that
      # rule enforced rather than remembered. Phase 12 retired the rule's Phase-11 form; plan 12-14
      # restated it as "a baselined surface may read a SEEDED EPHEMERAL database and must need
      # NOTHING ELSE", and `gate-visual` plus `baselines.yml` are where it is now enforced.
      #
      # DO NOT "fix" a red here by deleting this variable. An UNSET DATABASE_URL is strictly
      # worse than a wrong one: `postgres(undefined!)` falls back to libpq defaults and may find
      # a real database on some future runner, at which point the job is green and the property
      # it exists to protect is gone silently.
      DATABASE_URL: postgres://unreachable:unreachable@127.0.0.1:59999/nope

    steps:
      - uses: actions/checkout@v4

      # ════════════════════════════════════════════════════════════════════════════════════
      # THE PRICE OF PUTTING THIS JOB IN A CONTAINER, AND IT WAS PAID IN A REAL RED.
      # ════════════════════════════════════════════════════════════════════════════════════
      #
      # The container's uid is not the owner of the `actions/checkout` working directory, and
      # git 2.35.2+ REFUSES to operate on a repository it believes belongs to someone else:
      #
      #   fatal: detected dubious ownership in repository at '/__w/FitOut/FitOut'
      #
      # `tests/design/gitignore-baselines.test.ts` shells out to `git ls-files` — it is the
      # ONLY runtime git shell-out in the repository (AST/grep sweep of tests/, scripts/,
      # src/, e2e/ and config/, 2026-08-17; every other `git` string under tests/ is prose in
      # a recorded-evidence comment). It runs here and only here: `vitest.config.ts` excludes
      # `tests/design/**`, so job 2's `npm test` never reaches it. That is why this step is on
      # job 1 alone, and why `gate-price-parity` — also containerized — deliberately does not
      # have it: that job runs no code that shells out to git. The day it does, this step
      # comes with it.
      #
      # ⚠ WHAT ACTUALLY HAPPENED IS THE PART WORTH READING (run 32020141784, this job, exit 1).
      # The design gate went red, and the one failing assertion out of 700 was that file's
      # GUARD-THE-GUARD — "git could not answer" reported as a failure rather than laundered
      # into "git answered: nothing". Had that gate been written the obvious way (`try { … }
      # catch { return [] }`), `git ls-files` would have exited 128, the catch would have
      # returned an empty list, "zero platform baselines are tracked" would have been GREEN,
      # and D-29's rule would have been enforced by nothing inside this container from that
      # commit onward — silently, on every green run. Plan 11-03 built that discriminated
      # union against a hypothetical; the container produced it 19 plans later.
      #
      # THE FIX IS TO THE ENVIRONMENT AND NOT TO THE GATE. Do not make that test tolerate an
      # unavailable git to get a green here; the tolerance IS the defect.
      #
      # BOTH SPELLINGS ARE ADDED because a container job's `GITHUB_WORKSPACE` is a translated
      # container path (`/__w/<repo>/<repo>`) rather than the host path, and a step's default
      # working directory is that same location — so the two are expected to be identical and
      # the duplicate entry is harmless. Belt and braces cost one line; guessing wrong costs a
      # CI round trip, which is the only currency this workflow spends.
      - name: Let git operate on the checkout (container uid mismatch)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$PWD"

          # PROVE IT HERE, not ninety seconds later inside vitest with an assertion message
          # that sends the reader to the design gate instead of to the runner. Each command
          # below exits 128 under dubious ownership, and the default `bash -e` fails the step
          # on the spot. The two paths are echoed so the run log answers "did GITHUB_WORKSPACE
          # match?" without anybody having to reason about it.
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PWD=$PWD"
          git rev-parse --show-toplevel
          git ls-files "*-win32.png" "*-darwin.png"

          # POSITIVE CONTROL, and it is the same lesson in miniature: the commands above can
          # all succeed while printing NOTHING, which is indistinguishable from a git that ran
          # and found an empty index. So one query that MUST match something is run too.
          #
          # ⚠ IT IS NOT BELT-AND-BRACES — IT IS THE ONLY CHECK THAT CAUGHT ONE OF THE TWO LOCAL
          # FALSIFICATIONS OF THIS STEP. Rehearsed on 2026-08-17 by running this exact script
          # from a directory that is NOT a repository: `git rev-parse --show-toplevel` did not
          # fail. It walked UP, found an ancestor repository, and answered `C:/Users/Admin`
          # with exit 0 — a confident answer about a completely different repository. So both
          # of the "prove it" commands above passed while pointed somewhere else entirely, and
          # the count below is what returned 0 and failed the step. A command that answers
          # about the wrong thing is the same defect class as a command that cannot answer, and
          # only a query with a KNOWN non-empty result can tell either of them from success.
          #
          # A count of zero here means the checkout is not what this job thinks it is.
          #
          # ⚠ THE SECOND HALF OF THAT SENTENCE USED TO READ "and the visual step below would then
          # compare against baselines that are not there". THERE IS NO VISUAL STEP BELOW ANY MORE
          # (plan 12-15 moved it to `gate-visual`), so the consequence stated here was false as of
          # that edit and is corrected rather than left to mislead. THE CONTROL ITSELF STAYS, for
          # the reason that was always the primary one: the design gate in this job's `npm run
          # build` is the ONLY runtime git shell-out in the repository, and only a query with a
          # KNOWN non-empty result distinguishes "git works here" from "git answered confidently
          # about somewhere else". `gate-visual` carries its own copy of this control, because that
          # is where the comparison happens now and one clear error there is worth 52 confusing
          # ones.
          COUNT="$(git ls-files '*-visual-linux.png' | wc -l | tr -d ' ')"
          echo "tracked Linux baselines: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::git ran but reports zero tracked *-visual-linux.png files. Either the"
            echo "::error::baselines were deleted, or this is not the checkout this job expects."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          # Node 24 — the major this repository is developed and measured on (RESEARCH
          # § Environment Availability: v24.13.0). There is no `.nvmrc` and no `engines` field;
          # if one is ever added, this pin must follow it. `@types/node@^20` is a TYPE floor,
          # not a runtime pin, and is deliberately not the number used here.
          node-version: "24"
          cache: npm
      - run: npm ci

      # ════════════════════════════════════════════════════════════════════════════════════
      # THE WORKFLOW INVARIANTS BECOME A GATE RATHER THAN A RECIPE (plan 12-15).
      # ════════════════════════════════════════════════════════════════════════════════════
      #
      # `scripts/verify-workflows.mjs` parses BOTH workflow files and asserts the security
      # properties this file's header lists, plus the invariants that exist only BETWEEN the two
      # files (one image tag, one postgres image, and — the defect run 32216145319 exposed — the
      # capture job and the compare job migrating and seeding IDENTICALLY).
      #
      # WHAT THIS STEP MAKES ENFORCEABLE, stated as the thing it catches rather than as a policy:
      # an ADDED `push:` trigger on `.github/workflows/baselines.yml` now FAILS `ci`. That is the
      # single most dangerous edit anyone can make in this repository — it turns the one job that
      # can write baselines into a job that rewrites them on every commit, i.e. the gate
      # regenerating itself — and it is the mutation a whole-file substring check over that file's
      # seven load-bearing tokens was MEASURED GREEN for. Until this step existed, the most
      # dangerous file here was guarded by a script that ran only when somebody remembered it.
      #
      # WHY IT IS HERE AND NOT SOMEWHERE ELSE: this is the cheap job that always runs, and the
      # check costs about a second. It sits BEFORE the build so a structurally broken workflow
      # fails in roughly a minute instead of after a six-minute build.
      #
      # ⚠ THE STANDING RULE FOR ITS ONE FORESEEABLE FAILURE MODE. The script parses YAML with
      # `yaml`, which is relied upon TRANSITIVELY and is deliberately not a declared
      # devDependency (see the header). If a hoisting change ever makes it unresolvable, the
      # script prints its own distinct diagnostic and exits 3, saying in one line that NOTHING was
      # checked in either direction. IF THAT HAPPENS, THE FIX IS A DEPENDENCY DECISION TO RAISE —
      # add `yaml` to devDependencies — AND NEVER THE DELETION OF THIS STEP. A security gate that
      # is deleted the first time it is inconvenient was never a gate.
      - name: Verify the workflow invariants (parse, not grep)
        run: node scripts/verify-workflows.mjs

      - name: Build (lint + design gate + next build)
        run: npm run build
        env:
          # `DATABASE_URL` is NOT repeated here. It is on the job, above, with the full argument
          # for why it points at a closed port — moved there on 2026-08-17 so this step and the
          # visual step below cannot drift onto different databases.
          #
          # ── BUILD-ONLY PLACEHOLDERS. NOT SECRETS. NEVER MAKE THEM SECRETS. ──────────────
          # The very first CI run (run 31697376606) went red here, and it found a REAL defect
          # that had been latent for 167 commits and that NO local run could ever surface:
          #
          #   Error: BETTER_AUTH_SECRET is not set. Refusing to boot in production with a
          #   weak/default auth secret.
          #     at Object.<anonymous> (.next/server/app/api/cloudinary/sign/route.js:15:3)
          #   > Build error occurred
          #   Error: Failed to collect page data for /api/cloudinary/sign
          #
          # This was NOT a database error — `127.0.0.1:59999` never came into it, so job 1's
          # DB-free property held and the assertion above stands untouched. The actual finding
          # is narrower and worse: `next build` sets NODE_ENV=production, which arms every
          # fail-closed production boot guard in the tree, and `npm run build` therefore was
          # never environment-independent. It passes on a developer laptop only because dotenv
          # injects 16 keys from `.env.local`. A runner has no `.env.local`, and neither does a
          # fresh clone.
          #
          # An AST scan of all 230 files in `src/` finds FIVE module-scope boot guards that
          # throw on env. TWO of them already solve this correctly, with an explicit build
          # exemption (`NEXT_PHASE !== "phase-production-build"`):
          #
          #   src/app/api/inngest/route.ts:30   INNGEST_SIGNING_KEY        exempt — OK
          #   src/lib/paymongo.ts:39            PLATFORM_WALLET_*          exempt — OK
          #   src/lib/auth.ts:43                BETTER_AUTH_SECRET         NOT exempt — fires
          #   src/lib/paymongo.ts:27            PAYMONGO_SECRET_KEY        NOT exempt — fires
          #   src/app/api/paymongo/webhook/route.ts:36
          #                                     PAYMONGO_WEBHOOK_SECRET    NOT exempt — fires
          #
          # The three below are supplied here rather than by touching those guards, because
          # every one of them is a fail-closed SECURITY control (WR-03) and making a red check
          # green by softening a security control is the worst trade available. The guards keep
          # their exact production severity. See the SUMMARY for the recommendation that the
          # three non-exempt guards adopt the two exempt ones' `NEXT_PHASE` clause — that is a
          # decision about a security control's production branch, so it is raised, not taken.
          #
          # RULES FOR THESE VALUES, which is why they look the way they do:
          #   * They are deliberately, visibly fake and self-describing. None uses a real
          #     credential prefix — in particular NOT PayMongo's `sk_test_`/`sk_live_` shape —
          #     so none can be mistaken for a credential, and none could function as one if it
          #     ever leaked into a request. A live API rejects them immediately and loudly.
          #   * They exist ONLY to get module evaluation past a boot guard during page-data
          #     collection. Nothing here signs, encrypts, verifies or authenticates anything:
          #     `next build` makes no PayMongo call and mints no session.
          #   * They are literals in a public file ON PURPOSE (T-11-CISECRET). Do NOT promote
          #     them to `secrets.*`. A GitHub secret here would imply a real credential is
          #     needed to BUILD, which is exactly the property this job exists to disprove.
          BETTER_AUTH_SECRET: ci-build-only-placeholder-not-a-real-secret
          PAYMONGO_SECRET_KEY: ci-build-only-placeholder-not-a-real-key
          PAYMONGO_WEBHOOK_SECRET: ci-build-only-placeholder-not-a-real-webhook-secret

      # THE BUILD IS THIS JOB'S LAST STEP, AND THERE IS DELIBERATELY NOTHING AFTER IT. The GATE-01
      # comparison used to be here; it is job 4, `gate-visual`, as of plan 12-15. The parts of its
      # comment that were about the comparison went with it. The part that was about THIS job is the
      # three placeholders above: they are on the build step and were never inherited by anything
      # else, which is why nothing that moved needed them.

  # ------------------------------------------------------------------------------------------
  # JOB 2 — the full vitest suite against a real database.
  #
  # This is the job that takes the exclusion-constraint and money specs off the author's
  # laptop. It runs ON THE RUNNER (not inside a container), which is what fixes the service
  # hostname below.
  # ------------------------------------------------------------------------------------------
  gate-db:
    name: gate-db (vitest against PostGIS 18)
    runs-on: ubuntu-latest

    services:
      postgres:
        # PostGIS, NOT plain `postgres`: `drizzle/0005_booking_exclusion.sql` needs `btree_gist`
        # for the `space_id WITH =` term of the double-booking EXCLUDE constraint, and
        # `scripts/db-test-setup.ts` creates both `postgis` and `btree_gist` before replaying
        # migrations. A plain postgres image makes the whole exclusion suite fail to provision.
        #
        # The tag is pinned to the SAME value `docker-compose.yml` uses, so CI and local dev
        # cannot drift. Do not shorten it: the bare major-only tag was probed against
        # registry-1.docker.io on 2026-08-13 and returns 404 — it does not exist on Docker Hub.
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: fitout
          POSTGRES_PASSWORD: fitout
          POSTGRES_DB: fitout
        # Required because this job runs on the runner rather than in a container: the runner
        # is not on the services' user-defined bridge network, so the port must be published.
        ports: ["5432:5432"]
        # Without a health check the first step races the server's own initdb and fails with a
        # connection error that reads like a flaky service.
        options: >-
          --health-cmd "pg_isready -U fitout -d fitout"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # `localhost`, NOT the `postgres` service label. The addressing rule is: a job running IN
      # a container reaches a service by its LABEL with no port mapping; a job running ON the
      # runner reaches it at `localhost` and needs `ports:`. This job is the second case.
      # Getting it backwards produces a connection-refused that reads like a flaky service and
      # sends the reader to the wrong layer entirely.
      #
      # Note this names the DEV database `fitout`, not the test database. That is correct and
      # deliberate: the vitest suite does not use this URL directly. `tests/helpers/test-db-url.ts`
      # DERIVES its own target by rewriting the database name to `fitout_test`, and THROWS on any
      # resolved name not ending in `_test` — because `tests/global-setup.ts` TRUNCATEs every base
      # table in the target's public schema on every run, so pointing it at `fitout` would destroy
      # the dev database. The `_test` invariant is machine-enforced, not remembered, and this job
      # inherits that enforcement rather than restating it.
      DATABASE_URL: postgres://fitout:fitout@localhost:5432/fitout

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      # Migrate the DEV database (`fitout`) first. `db:test:setup` bootstraps `fitout_test` from
      # a connection to this one — you cannot CREATE DATABASE from a connection to its own
      # target — so `fitout` must exist and be reachable before the next step.
      - name: Migrate dev database
        run: npm run db:migrate

      # Provision `fitout_test`: CREATE DATABASE, create `postgis` + `btree_gist` explicitly
      # WITH SCHEMA public (migration 0001 omits the SCHEMA clause, which on a fresh database
      # would otherwise install PostGIS into a per-file test schema that teardown then drops),
      # then replay every migration into its public schema. Idempotent; exits 0 on a re-run.
      - name: Provision the test database (fitout_test)
        run: npm run db:test:setup

      - name: Vitest (full suite)
        run: npm test

  # ------------------------------------------------------------------------------------------
  # JOB 3 — the ONE deliberate e2e re-opening (D-35). GATE-05's other half.
  #
  # Job 1 proves no money COMPUTATION crosses the client boundary. It is completely silent on
  # whether the figure that reaches the DOM is the figure that was frozen — and a restyle that
  # moved or re-derived the checkout total would pass every other gate in this file while
  # charging a real card a number the booker never agreed to. `e2e/price-parity.spec.ts` is the
  # single assertion in that gap: the rendered total, normalised back to integer centavos,
  # equals `booking.quoted_total_cents` for the hold the UI just placed.
  #
  # ⚠️ THE SECRET CONTRACT, WHICH IS WHY THIS JOB IS ALLOWED TO EXIST AT ALL (T-11-CISECRET).
  # This job needs EXACTLY ONE environment input: `DATABASE_URL`, inline below. Not a secret —
  # a service container's own credentials. The spec's flow STOPS at the reserve page, before
  # `Confirm & pay` opens a PayMongo hosted checkout, so it needs no PayMongo, Resend,
  # Cloudinary, Better-Auth or Google credential. `next dev` (unlike `next build`) does not set
  # NODE_ENV=production, so none of the five fail-closed boot guards job 1 documents arms here
  # either.
  #
  # IF A FUTURE EDIT MAKES THIS JOB NEED A SECOND CREDENTIAL, THAT IS NOT A CONFIGURATION GAP —
  # it is the signal that the spec has grown past D-35's boundary. Split the spec and keep the
  # gated part out of CI. Do NOT add `secrets.*` here: an e2e job is the largest exfiltration
  # surface in this workflow, and the reason this one is safe is that it holds nothing.
  # ------------------------------------------------------------------------------------------
  gate-price-parity:
    name: gate-price-parity (DB-vs-DOM price, 1 spec)
    runs-on: ubuntu-latest

    # IN the pinned Playwright image, not on the bare runner. Three consequences, all load-bearing:
    #   * The image ships the browsers AND their OS dependencies, so there is no
    #     `npx playwright install --with-deps` step to run, cache or get wrong.
    #   * The tag MUST match the project's exact Playwright pin (`@playwright/test@1.60.0`).
    #     Playwright's own docs: if the image version does not match the project version,
    #     "Playwright will be unable to locate browser executables". `v1.60.0-noble` is the
    #     verified MCR tag; bump it and the package version together or not at all.
    #   * `--ipc=host` is Playwright's documented recommendation for Chromium — "without it,
    #     Chromium can run out of memory and crash". That failure looks like a flaky test, so
    #     it would be retried rather than fixed. It is not optional.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --ipc=host

    services:
      postgres:
        # Same tag as job 2 and `docker-compose.yml`. The bare major-only tag is a confirmed
        # 404 on Docker Hub (probed 2026-08-13) — do not shorten it.
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: fitout
          POSTGRES_PASSWORD: fitout
          POSTGRES_DB: fitout
        # ⚠️ NO `ports:` MAPPING HERE, AND THAT ABSENCE IS DELIBERATE — see the DATABASE_URL
        # comment below. Publishing a port would not break this job, but it would make the
        # `localhost` spelling appear to work and quietly invite the wrong one back.
        options: >-
          --health-cmd "pg_isready -U fitout -d fitout"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # THE SERVICE LABEL `postgres`, NOT `localhost` — the mirror image of job 2, and the one
      # line most likely to be "corrected" into a day of debugging. The addressing rule
      # (docs.github.com, Creating PostgreSQL service containers):
      #
      #   job runs IN a container   → reach the service by its LABEL, no port mapping needed
      #                               (both are on the same user-defined bridge network)
      #   job runs ON the runner    → reach it at `localhost`, and `ports:` is required
      #
      # This job is the FIRST case; `gate-db` above is the second. Getting it backwards produces
      # a connection-refused that reads exactly like a flaky service — so it gets retried, not
      # diagnosed, and the retry fails the same way.
      #
      # Both the app under test (the dev server Playwright boots) and the spec's own postgres.js
      # client read this one variable, so they cannot drift onto different databases.
      DATABASE_URL: postgres://fitout:fitout@postgres:5432/fitout

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24, matching jobs 1 and 2 rather than whatever major the Playwright image
          # happens to ship, so all three gates run the same runtime.
          node-version: "24"
          cache: npm
      - run: npm ci

      # The spec seeds and tears down its own rows, but the TABLES have to exist first. Only
      # the dev database `fitout` is needed here — this job runs no vitest, so the `fitout_test`
      # provisioning `gate-db` does is deliberately absent.
      - name: Migrate the database
        run: npm run db:migrate

      # EXACTLY ONE SPEC, NAMED. Not `npm run test:e2e`, which would run all twelve and re-open
      # the whole surface D-24 closed. Playwright's own config boots the dev server
      # (`webServer: npm run dev`, and `reuseExistingServer: !process.env.CI` means CI always
      # gets a fresh one), so there is no server step here either.
      - name: Playwright — DB-vs-DOM price parity (1 spec)
        run: npx playwright test e2e/price-parity.spec.ts --project=chromium

  # ------------------------------------------------------------------------------------------
  # JOB 4 — GATE-01's COMPARISON (plan 12-15). THE MACHINE THAT COMPARES MUST BE THE MACHINE
  # THAT SHOT, AND IT MUST BE LOOKING AT THE TREE THAT WAS PHOTOGRAPHED.
  #
  # WHY THIS IS A JOB AND NOT A STEP ON JOB 1. It was a step on job 1 from 2026-08-17, and that
  # was correct while 11-UI-SPEC § GATE-01 scoped baselines to DB-free surfaces only. Phase 12
  # baselined PRODUCT surfaces — search results, a listing page, a checkout behind a real hold, a
  # relaxation band, a collision notice — and 27 of the 52 committable baselines now read the
  # database. Run **32216145319** measured exactly what that costs on a job with no database: 36
  # failed, 30 passed (Phase 11's DB-free surfaces), every failure a per-row reachability hook
  # reporting `connect ECONNREFUSED 127.0.0.1:59999`.
  #
  # So the split by DATABASE NEED (D-24) puts the comparison HERE — a database AND a browser,
  # which is precisely job 3's place in that taxonomy — rather than putting a service container
  # into the job whose entire identity in that taxonomy is needing none. That alternative was
  # considered and rejected: it would destroy job 1's live proof that `npm run build` needs no
  # database, and the thing that proof catches is a product failure, not a style one. A DB-touching
  # route that silently becomes build-time prerendered builds green and ships a page of FROZEN
  # AVAILABILITY — one of the two failure modes PROJECT.md names as unacceptable for the core value.
  #
  # THIS JOB IS A STEP-FOR-STEP MIRROR OF `.github/workflows/baselines.yml`'s JOB, AND THAT IS THE
  # POINT RATHER THAN A CONVENIENCE. The capture job runs `checkout → npm ci → migrate → seed →
  # playwright`; so does this one. Job 1 could not: it must build first, so the capture ran
  # `next dev` against a clean tree while the comparison ran it with a production `.next` already
  # on disk. The migrate command, the seed command and the `DATABASE_URL` are BYTE-IDENTICAL across
  # the two files, and `scripts/verify-workflows.mjs`'s `cross` section asserts that — because the
  # compared tree is the captured tree only if both jobs seed the same way, and 12-14's own plan
  # wrote that rule down before failing to apply it.
  #
  # WHAT THIS JOB HOLDS: NOTHING (T-11-CISECRET). One environment input, `DATABASE_URL`, pointing
  # at an ephemeral service container whose credentials are its own fixed, runner-local pair, on a
  # database destroyed with the job and reachable only from inside the job's network. No PayMongo /
  # Resend / Cloudinary / Better-Auth / Google credential, and none is needed: Playwright boots the
  # app with `npm run dev`, and `next dev` (unlike `next build`) does not set NODE_ENV=production,
  # so none of the five fail-closed module-scope boot guards job 1 documents arms here. That is why
  # job 1's three build placeholders are NOT repeated below — the same argument job 3 and
  # `baselines.yml` make. If a baselined surface ever starts needing a real credential, it has left
  # GATE-01's scope: FIX THE INVENTORY, do not widen the environment.
  #
  # AND NO `permissions:` BLOCK. This job inherits the workflow default, `contents: read`. Unlike
  # `baselines.yml`'s job it cannot write to the repository, which is the entire difference between
  # a job that COMPARES and a job that WRITES. The parser asserts the absence.
  #
  # ⚠ THE FLAG THAT CAN WRITE A BASELINE IS NOT IN THIS FILE, NOT IN THIS JOB, AND NOT IN THIS
  # COMMENT. It lives in `baselines.yml` alone, in exactly one run command. Here it would make this
  # job regenerate the reference it is supposed to be checking against — green forever, measuring
  # nothing: the same fail-open D-135 prescribed and D-28 closed in configuration, rebuilt one
  # layer up (T-11-BASEMINT). It is named by ROLE and never by spelling anywhere in this file,
  # because the cheapest audit of the prohibition is a grep for the token returning 0 and prose
  # about a forbidden token is still the token — this file's header records that rule breaking its
  # own audit twice before it was rewritten. `playwright.config.ts`'s unconditional
  # `updateSnapshots: "none"` is what stops this job writing anything even when a baseline is
  # missing: MEASURED (11-RESEARCH Finding 4), that case writes ZERO files, loses the
  # `, writing actual.` clause from its error, and is RETRIABLE — so it stays red across all three
  # CI retries and across a bare re-run. Under Playwright's default `"missing"` the same case
  # writes the PNG and the next re-run is green with no code change.
  #
  # `reuseExistingServer: !process.env.CI` means CI always gets a FRESH dev server. Not a
  # convenience: a reused server can serve a stylesheet that predates the checkout, and in the
  # visual project a stale stylesheet is not a false red — it is a comparison against CSS that is
  # not in the tree.
  # ------------------------------------------------------------------------------------------
  gate-visual:
    name: gate-visual (GATE-01 visual regression)
    runs-on: ubuntu-latest

    # IN the pinned Playwright image, at the SAME EXACT TAG `baselines.yml` mints the baselines in
    # and the same tag the installed `@playwright/test` carries (1.60.0, pinned exact by plan 11-03,
    # T-11-VERDRIFT). That identity is the whole of D-27: a screenshot is a function of the browser,
    # the fonts and the OS that produced it, so "the baseline matches" only means something when the
    # machine that compares is the machine that shot. FOUR TAGS AND A PACKAGE now move together or
    # none of them do — this one, job 1's, job 3's, `baselines.yml`'s, and `@playwright/test` — and
    # `scripts/verify-workflows.mjs` asserts all five against each other. If they ever diverge,
    # every baseline in the repository becomes noise on the same day and the failure reads as 52
    # unrelated visual regressions.
    #
    # No `npx playwright install` step: the image ships the browsers and their OS dependencies, and
    # adding one is the most common way a container job ends up comparing against a browser nobody
    # pinned. `--ipc=host` is Playwright's documented Chromium recommendation — "without it,
    # Chromium can run out of memory and crash", which presents as a flaky test and therefore gets
    # retried rather than fixed. Not optional.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --ipc=host

    # POSTGIS, NOT PLAIN `postgres`: `drizzle/0005_booking_exclusion.sql` needs `btree_gist` for the
    # `space_id WITH =` term of the double-booking EXCLUDE constraint, and the migration set this job
    # replays includes it — a plain postgres image makes provisioning fail outright. The tag is the
    # same one `baselines.yml`, jobs 2 and 3, and `docker-compose.yml` use, so CI and local dev
    # cannot drift. Do not shorten it: the bare major-only tag was probed against
    # registry-1.docker.io on 2026-08-13 and returns 404.
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: fitout
          POSTGRES_PASSWORD: fitout
          POSTGRES_DB: fitout
        # ⚠️ NO `ports:` MAPPING, AND THAT ABSENCE IS DELIBERATE — see the DATABASE_URL comment
        # below. Publishing a port would not break this job, but it would make the `localhost`
        # spelling appear to work and quietly invite the wrong one back. The parser now asserts the
        # pairing in both directions, so the two halves cannot drift apart.
        # Without a health check the first step races the server's own initdb and fails with a
        # connection error that reads like a flaky service.
        options: >-
          --health-cmd "pg_isready -U fitout -d fitout"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # THE SERVICE LABEL `postgres`, NOT `localhost`. The addressing rule (docs.github.com,
      # Creating PostgreSQL service containers):
      #
      #   job runs IN a container   → reach the service by its LABEL, no port mapping needed
      #                               (both sit on the same user-defined bridge network)
      #   job runs ON the runner    → reach it at `localhost`, and `ports:` is required
      #
      # This job runs IN the pinned image (see `container:` above), so it is the FIRST case — the
      # same as job 3 and `baselines.yml`, the opposite of job 2. Getting it backwards produces a
      # connection-refused that reads exactly like a flaky service, so it gets retried rather than
      # diagnosed and every retry fails the same way. `ci.yml`'s own vacuity table measured a
      # whole-file substring check GREEN for precisely this swap, which is why the parser now
      # asserts it per job as a total function.
      #
      # ONE VARIABLE, TWO READERS, AND THE SECOND ONE IS EASY TO MISS. The dev server Playwright
      # boots reads it, and so does `e2e/helpers/visual-drive.ts`, which opens its OWN postgres
      # client from the test process (the checkout and collision drives mutate rows). That helper
      # falls back to `localhost` when `DATABASE_URL` is unset, so in a container job the default
      # silently targets the wrong host — the value has to be right for the TEST process, not just
      # for the app under test.
      #
      # BYTE-IDENTICAL TO `baselines.yml`'s, ON PURPOSE AND BY ASSERTION. The compared tree is the
      # captured tree only if both jobs talk to the same shape of database.
      #
      # DO NOT "fix" a red here by unsetting it. An UNSET DATABASE_URL is strictly worse than a
      # wrong one: `postgres(undefined!)` falls back to libpq defaults and may find a real database
      # on some future runner, at which point the job is green and the property is gone silently.
      DATABASE_URL: postgres://fitout:fitout@postgres:5432/fitout

    steps:
      - uses: actions/checkout@v4

      # THE CONTAINER'S UID IS NOT THE OWNER OF THE CHECKOUT, and git 2.35.2+ refuses to operate on
      # a repository it believes belongs to someone else (`fatal: detected dubious ownership in
      # repository at '/__w/FitOut/FitOut'` — run 32020141784, job 1, before it carried this step).
      #
      # THE POSITIVE CONTROL IS THE LOAD-BEARING HALF, AND IT IS HERE FOR A REASON THAT IS THIS
      # JOB'S OWN RATHER THAN INHERITED. `git rev-parse --show-toplevel` is NOT sufficient proof
      # that git is answering about the right repository: rehearsed on 2026-08-17 from a directory
      # that is not a repository, it walked UP to an ancestor repo and answered `C:/Users/Admin`
      # with exit 0 — a confident answer about somewhere else entirely. Only a query with a KNOWN
      # non-empty result distinguishes "git works here" from "git answered about the wrong tree",
      # and for THIS job that query is the tracked-baseline count. A zero means this job is about to
      # compare against baselines that are not in the checkout, and ONE clear error is worth 52
      # confusing ones.
      #
      # It runs BEFORE `npm ci` deliberately: a wrong checkout should fail in seconds rather than
      # after a minute of installing.
      - name: Let git operate on the checkout, and prove it is the right one
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$PWD"

          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PWD=$PWD"
          git rev-parse --show-toplevel

          COUNT="$(git ls-files '*-visual-linux.png' | wc -l | tr -d ' ')"
          echo "tracked Linux baselines: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::git ran but reports zero tracked *-visual-linux.png files. Either the"
            echo "::error::baselines were deleted, or this is not the checkout this job expects."
            echo "::error::Comparing against an empty reference set would report 52 missing"
            echo "::error::baselines instead of the one real problem."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          # Node 24, matching every other job in this file AND `baselines.yml`, rather than whatever
          # major the Playwright image happens to ship — so the baselines are compared by the same
          # runtime that produced them.
          node-version: "24"
          cache: npm
      - run: npm ci

      # The TABLES have to exist before anything can be seeded into them. Only the dev database
      # `fitout` is needed: this job runs no vitest, so the `fitout_test` provisioning job 2 does is
      # deliberately absent, exactly as in job 3 and `baselines.yml`.
      #
      # BYTE-IDENTICAL TO `baselines.yml`'s migrate command, and asserted.
      - name: Migrate the database
        run: npm run db:migrate

      # THE SAME COMMITTED FIXTURE THE CAPTURE JOB SEEDS, RUN THE SAME WAY. This is the line whose
      # absence was the whole defect: `scripts/seed-baseline-fixtures.ts` uses FIXED ids,
      # coordinates, rates, photo urls and a fixed collision window — deliberately not
      # `randomUUID()`, because anything that varies between runs shows up as a pixel diff and
      # trains people to re-mint the reference instead of reading the diff. It is idempotent (it
      # deletes every `vrt_%` row first, in FK-safe order).
      #
      # IT ALSO OWNS THE D-58 TRAP: `/listings/-/opengraph-image` answers 200 with NO database,
      # serving a `GenericCard` byte-identical to the root card (25,844 B, measured in plan 11-20).
      # Without this step the OG baseline is green forever while covering the wrong card.
      #
      # BYTE-IDENTICAL TO `baselines.yml`'s seed command, and asserted. `npx tsx` is the spelling
      # that file already ships; `tsx` (4.22.4) is a transitive resolution both jobs rely on.
      - name: Seed the baseline fixtures
        run: npx tsx scripts/seed-baseline-fixtures.ts

      # `--project=visual` BY NAME. That project is the one `playwright.config.ts` constructs ONLY on
      # Linux (D-29), and its name is a segment of every baseline filename —
      # `{arg}-visual-linux.png`, measured in 11-RESEARCH Finding 1 — so renaming the project
      # orphans every committed baseline at once. Naming it here rather than running
      # `npm run test:e2e` is also what keeps D-24 closed: this job runs the visual project and
      # nothing else.
      - name: Playwright — visual regression (GATE-01)
        run: npx playwright test --project=visual

  # ------------------------------------------------------------------------------------------
  # JOB 5 — THE FUNCTIONAL PLAYWRIGHT SUITE (CI-01 / D-24's remaining half).
  #
  # WHY A FIFTH JOB AND NOT A WIDER JOB 3 (D-12). This file's own header enumerates the mutation:
  # "job 3's one spec -> the whole suite" is a change the invariant checker is built to notice,
  # and job 3's identity in the D-24 taxonomy is that it is ONE self-contained spec. Widening it
  # destroys that identity and silently re-opens the surface job 3 was scoped to close. A fifth
  # job is the shape the taxonomy already had room for: a database AND a browser, like jobs 3
  # and 4, differing only in WHICH specs it runs. `gate-price-parity` above is therefore left
  # BYTE-UNCHANGED — its run command still names exactly one spec file — and this job was
  # APPENDED, so the diff that introduced it deletes nothing.
  #
  # NO BROWSER-PROVISIONING STEP, AND THAT ABSENCE IS THE POINT. Playwright's own ci-intro guide
  # recommends one and it is WRONG FOR THIS REPO: the pinned image ships the browsers AND their
  # OS dependencies, and job 3's comment above (`ci.yml:770-774`) records that adding one is the
  # most common way a container job ends up comparing against a browser nobody pinned. Follow
  # the repo, not the quickstart.
  #
  # WHAT THIS JOB HOLDS: NOTHING. One environment input, DATABASE_URL, pointing at an ephemeral
  # service container, and ZERO `secrets.` references of any kind. Playwright boots the app with
  # `npm run dev`, and `next dev` does not set NODE_ENV=production, so none of the five
  # module-scope boot guards job 1 documents arms here — which is why job 1's three build
  # placeholders are not repeated. Same argument jobs 3 and 4 make. An e2e job is the largest
  # exfiltration surface in this workflow, and the reason this one is safe is that it holds
  # nothing.
  #
  # NO `permissions:` BLOCK — it inherits the workflow default `contents: read`, exactly as jobs
  # 3 and 4 do, and `scripts/verify-workflows.mjs` asserts no job in this file holds
  # `contents: write`. The write path is `baselines.yml` alone.
  #
  # NO COMPILE STEP OF ANY KIND — no `npm run build`, no `next build`, no `next start`. Two
  # separate reasons, both load-bearing:
  #   * A job that runs `npm run build` joins `verify-workflows.mjs`'s T-11-DBFREE set
  #     (`:552-561`), which requires that job to declare NO `services:`. This job declares one,
  #     so adding a build step here turns that invariant red — correctly, and the fix is to
  #     remove the build step, never to soften the invariant.
  #   * `playwright.config.ts`'s `webServer` is `npm run dev`, and that is load-bearing for BOTH
  #     network seams: `instrumentation.ts`'s undici MockAgent is gated on
  #     `NODE_ENV !== "production"` as a BUILD-TIME constant (a production build PRUNES it), and
  #     `webServer.env`'s empty mail key only applies to the server Playwright itself boots. A
  #     job that boots the app any other way silently re-opens both.
  # ------------------------------------------------------------------------------------------
  gate-e2e:
    name: gate-e2e (functional Playwright suite)
    runs-on: ubuntu-latest

    # THE FULL SUITE'S CI WALL-CLOCK IS UNMEASURED BY CONSTRUCTION (D-13) — this job is what
    # measures it. The cap below is A STOP, NOT AN ESTIMATE: without a cap a suite that wedges
    # holds a runner for six hours.
    #
    # RAISED ONCE, 45 → 90, ON MEASURED EVIDENCE (plan 19-08, 2026-09-04). The first real run of
    # this job — run 33837652193, job 100913340558, on the `dev` push at 04:40:09Z — EXPIRED at the
    # 45-minute cap. It is recorded here rather than tidied away, because the expiry is the
    # measurement:
    #
    #   * `Running 460 tests using 1 worker` — 460 tests across 39 spec files. `workers` is
    #     unset in playwright.config.ts, so it defaults to half the logical cores, and a 2-core
    #     ubuntu-latest runner gives ONE worker. The suite is therefore SERIAL here, which is the
    #     single largest term in this number and the thing any sharding decision would attack.
    #   * Setup to first test: 4m 22s (containers 58s, checkout 3s, setup-node 7s, `npm ci` 2m 49s,
    #     mail refusal 0s, migrate 1s, seed 1s).
    #   * Suite step: 04:44:11Z → cancelled 05:25:17Z, i.e. 40m 46s, in which it completed 35 of the
    #     39 spec files (537 result lines: 383 passed, 38 failed, 116 skipped). The four it never
    #     reached are skeleton-geometry, stale-session-selfheal, tabular-figures and
    #     zero-result-relax.
    #   * Linear projection: 40m 46s × 39/35 ≈ 45m 26s of suite, + 4m 22s of setup ≈ 50 minutes.
    #
    # 90 is that ~50-minute projection with ~1.8× headroom, and the headroom is not padding: the
    # four unreached specs are unmeasured, and `retries: 2` means a newly-failing test costs three
    # attempts rather than one.
    #
    # ⚠ THIS CAP HAS NOW BEEN RAISED ONCE AND MUST NOT BE RAISED AGAIN. A suite that cannot finish
    # inside 90 minutes is the sharding conversation D-13 defers, not a configuration one.
    # ⚠ Once this job is a required check, an expiry here is a RED, and the correct response is
    # D-13's sharding decision — never raising the cap silently.
    timeout-minutes: 90

    # IN the pinned Playwright image, not on the bare runner. Job 3's three arguments apply
    # unchanged:
    #   * The image ships the browsers AND their OS dependencies, so there is no provisioning
    #     step to run, cache or get wrong.
    #   * The tag MUST match the project's exact Playwright pin (`@playwright/test@1.60.0`).
    #     `v1.60.0-noble` is the verified MCR tag; bump it and the package version together or
    #     not at all. `verify-workflows.mjs`'s `cross` section additionally asserts this string
    #     is identical across every containerized job in BOTH workflow files.
    #   * `--ipc=host` is Playwright's documented recommendation for Chromium — without it,
    #     Chromium can run out of memory and crash. That failure looks like a flaky test, so it
    #     would be retried rather than fixed. It is not optional.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --ipc=host

    services:
      postgres:
        # Same tag as jobs 2, 3 and 4 and `docker-compose.yml`. The bare major-only tag is a
        # confirmed 404 on Docker Hub (probed 2026-08-13) — do not shorten it.
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: fitout
          POSTGRES_PASSWORD: fitout
          POSTGRES_DB: fitout
        # ⚠️ NO `ports:` MAPPING HERE, AND THAT ABSENCE IS DELIBERATE — see the DATABASE_URL
        # comment below. A containerized job reaches a service by its LABEL. Publishing a port
        # would not break this job, but it would make the `localhost` spelling appear to work
        # and quietly invite the wrong one back.
        options: >-
          --health-cmd "pg_isready -U fitout -d fitout"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # THE SERVICE LABEL `postgres`, NOT `localhost` — the same case job 3 is, and the mirror
      # image of job 2. The addressing rule (docs.github.com, Creating PostgreSQL service
      # containers):
      #
      #   job runs IN a container   → reach the service by its LABEL, no port mapping needed
      #   job runs ON the runner    → reach it at `localhost`, and `ports:` is required
      #
      # Getting it backwards produces a connection-refused that reads exactly like a flaky
      # service — so it gets retried, not diagnosed, and the retry fails the same way.
      #
      # Both the app under test (the dev server Playwright boots) and any spec's own postgres.js
      # client read this one variable, so they cannot drift onto different databases.
      #
      # ⚠ THIS IS THE ONLY ENVIRONMENT INPUT THIS JOB HAS.
      DATABASE_URL: postgres://fitout:fitout@postgres:5432/fitout

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24, matching jobs 1 through 4 rather than whatever major the Playwright image
          # happens to ship, so every gate runs the same runtime.
          node-version: "24"
          cache: npm
      - run: npm ci

      # ⚠ THE FAIL-CLOSED MAIL ASSERTION (D-14), AND IT IS FIRST ON PURPOSE (finding [17-D28]).
      # `instrumentation.ts` takes PayMongo off the wire and DELIBERATELY does not do the same
      # for the mail provider — its header argues the point: `src/lib/email.ts` binds the client
      # at module load, so for that provider THE KEY IS THE SWITCH, and mocking the origin would
      # also suppress the `[email:dev]` console fallback. A full suite run with the key set was
      # MEASURED at FOURTEEN real outbound sends. Nothing in this workflow supplies that key
      # today; this step is what makes that a PROPERTY instead of a COINCIDENCE, and it runs
      # before anything boots so a violation costs seconds rather than a whole suite of real
      # email sent to real addresses.
      #
      # ⚠ FALSIFIED 2026-09-04 BY PLAN 19-12 (review finding CR-01). THE CLAIM WAS: the step below
      # carries an `env:` key whose name is deliberate, not incidental, because it is named after
      # NEITHER the mail provider NOR its prefix — the parse-based sibling of this assertion lives
      # in `scripts/verify-workflows.mjs` and rejects any workflow, job or step `env` KEY whose name
      # begins with that prefix, so naming this key after the provider would make that invariant
      # fire against a CORRECT file; the two sites were spelled differently on purpose, and each of
      # them said so. That history is accurate and the carve-out was real. WHAT REPLACED IT: the
      # step below has no `env:` map at all. It runs a committed script that reads the job's REAL
      # PROCESS ENVIRONMENT and reads the provider's prefix out of the checker that owns it, so
      # there is no second spelling here to keep apart, and nothing for the parse half to carve
      # out. The old form tested a GitHub Actions `${{ env.… }}` EXPRESSION context, which is built
      # exclusively from `env:` maps written in this file — never the process environment, secrets,
      # `vars.*`, `container.env` or `services.*.env` — so it could fire on exactly the one input
      # the parse half already rejects the whole file for, and its real coverage was ZERO.
      #
      # ⚠ THE PARSE HALF PROTECTS THE NEXT RUN, NEVER THIS ONE, AND THAT IS WHY THIS STEP EXISTS.
      # `gate-db-free` and `gate-e2e` declare no `needs:`, so they start in parallel, and GitHub
      # cancels neither when the other fails: job 1 going red does not stop this job booting the
      # app. This step is what protects THIS run — it costs seconds, and it runs before the
      # database is migrated, before the catalogue is seeded and before Playwright boots anything.
      - name: Refuse to run the suite with a live mail credential in the environment
        run: node scripts/refuse-mail-credential.mjs

      # The specs seed and tear down their own rows, but the TABLES have to exist first. Only
      # the dev database `fitout` is needed here — this job runs no vitest, so the `fitout_test`
      # provisioning `gate-db` does is deliberately absent.
      - name: Migrate the database
        run: npm run db:migrate

      # ⚠ NOT OPTIONAL — AND JOB 3 DOES NOT HAVE THIS STEP, so do not read its absence there as
      # evidence that it is optional here. FIVE specs in this set fail against an empty catalogue
      # and say so in their own failure messages: axe-sweep, overflow-320, reduced-motion, shell
      # and skeleton-geometry. `scripts/seed.ts` is standalone raw SQL, reads DATABASE_URL, holds
      # no credential, and is idempotent (it deletes its `seed_*` rows first).
      - name: Seed the demo catalogue
        run: npm run db:seed

      # THE `chromium` PROJECT BY NAME, AND NO SPEC PATH AFTER IT. Not `npm run test:e2e`, which
      # is a bare `playwright test` and on Linux therefore ALSO collects the `visual` project — a
      # wholly different gate that job 4 owns and whose committed baselines this job must never
      # touch. `playwright.config.ts`'s chromium project is `testMatch: "e2e/*.spec.ts"`, so
      # naming the project IS naming the whole functional set (37 specs when this job landed).
      # Playwright's own config boots the dev server (`webServer: npm run dev`, with
      # `reuseExistingServer: false`, so CI always gets a fresh one), which is why there is no
      # server step here either.
      - name: Playwright — the functional suite
        run: npx playwright test --project=chromium
